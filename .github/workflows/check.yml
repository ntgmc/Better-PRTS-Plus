name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check userscript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run project checks
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/check.ps1

      - name: Run offline release tests for tooling changes
        shell: bash
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]] ||
            ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'tool/*.ps1' tool/prepare-release.js src/core/release-manifest.js releases.json .githooks .github/workflows; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File tool/test-release.ps1
          else
            echo "Release tooling is unchanged; skipping offline release tests."
          fi

  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli @commitlint/config-conventional

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Lint initial push commit
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: npx commitlint --last --verbose
